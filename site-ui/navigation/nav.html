<!-- 共通ポップアップ本体 -->
<div
  id="custom-modal-overlay"
  class="custom-modal-overlay"
  onclick="if (event.target === this) closeCustomModal();"
  aria-hidden="true"
>
  <div
    class="custom-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="custom-modal-title"
  >
    <button
      type="button"
      class="custom-modal-close"
      onclick="closeCustomModal()"
      aria-label="閉じる"
    >×</button>

    <h2 id="custom-modal-title"></h2>

    <div id="custom-modal-body"></div>
