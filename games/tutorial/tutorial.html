<script>
(function () {
  const overlay = document.getElementById("mlc-modal-overlay");

  function closeModal() {
    overlay.style.display = "none";
    overlay.setAttribute("aria-hidden", "true");
  }

  document.querySelectorAll("[data-mlc-open]").forEach(function (card) {
    card.addEventListener("click", function (e) {
      e.preventDefault();
      overlay.querySelectorAll(".mlc-modal-content").forEach(function (c) {
        c.hidden = true;
      });
      document.getElementById(card.dataset.mlcOpen).hidden = false;
      overlay.style.display = "flex";
      overlay.setAttribute("aria-hidden", "false");
    });
  });

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay || e.target.closest("[data-mlc-close]")) closeModal();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });
})();
</script>
